<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A vermilion seal on paper, read top to bottom: 天地. Characters are set
       as text, not paths, so they stay crisp at every size; the stack lists
       every CJK face a desktop browser is likely to have. -->
  <rect width="64" height="64" fill="#ece2cb"/>
  <rect x="5" y="5" width="54" height="54" fill="#b5322a"/>
  <rect x="9" y="9" width="46" height="46" fill="none" stroke="#ece2cb" stroke-width="2"/>
  <g fill="#ece2cb" font-family="'Noto Serif TC','PingFang TC','Microsoft JhengHei','Songti TC','Noto Serif CJK TC','SimSun',serif" font-weight="900" font-size="22" text-anchor="middle">
    <text x="32" y="30">天</text>
    <text x="32" y="52">地</text>
  </g>
</svg>

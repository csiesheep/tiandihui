<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A two-character seal, read top to bottom: 天地. Gold on the site's own
       dark ground, with a hairline border for the 印章 edge. Characters are
       set as text, not paths, so they stay crisp at every size; the stack
       lists every CJK face a desktop browser is likely to have. -->
  <rect width="64" height="64" rx="12" fill="#0e1116"/>
  <rect x="3.5" y="3.5" width="57" height="57" rx="9" fill="none" stroke="#6d4f17" stroke-width="2"/>
  <g fill="#d9a441" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei','Heiti TC','Noto Sans CJK TC','SimHei',sans-serif" font-weight="700" font-size="25" text-anchor="middle">
    <text x="32" y="29">天</text>
    <text x="32" y="56">地</text>
  </g>
</svg>

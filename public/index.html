  "@context": "https://schema.org",
  "@type": "VideoGame",

  "description": "A free browser social deduction game for five to ten players. Everyone swears the oath; two to four are secretly informing for the Qing court. Each round a leader proposes a team, the table votes, and the team carries out a mission that any informer on it can wreck. Three missions decide it. Play alone against AI bots, or open an online room and share a four-letter code with friends. English and Traditional Chinese.",
  "genre": ["Social deduction", "Party game", "Board game"],
  "numberOfPlayers": { "@type": "QuantitativeValue", "minValue": 1, "maxValue": 10 },
  "playMode": ["SinglePlayer", "MultiPlayer"],

<body>

<header class="top">
  <a href="." data-link class="brand"><span data-t="title"></span></a>
  <nav>
    <a href="rules" data-t="nav.rules"></a>
    <button type="button" id="langBtn" class="linkish" data-t="nav.lang"></button>
  </nav>
</header>

<!-- ===== Landing ===== -->
<main id="view-landing" class="scr" hidden>
  <div class="hero-wrap">
    <div class="hero-row"><div class="seal"><span>天地</span></div><p class="hero" id="hero"></p></div>
    <span class="hero-tag" data-t="heroTag"></span>
  </div>
  <p class="tag-line" data-t="tagline"></p>
  <div class="spacer"></div>
  <button type="button" class="btn p" id="btnPlay" data-t="landing.play"></button>
  <label class="field"><span data-t="landing.name"></span><input id="landName" maxlength="16" autocomplete="off"></label>
  <button type="button" class="btn" id="btnCreate" data-t="landing.create"></button>
  <div class="row">
    <label class="field grow"><span data-t="landing.code"></span><input id="joinCode" maxlength="4" autocapitalize="characters" autocomplete="off" placeholder="_ _ _ _"></label>
    <button type="button" class="btn sm gh" id="btnJoin" data-t="landing.join"></button>
  </div>
  <p class="foot muted" id="landStatus"></p>
  <p class="about" data-t="landing.about"></p>
  <p class="foot"><small data-t="credit"></small></p>
  <p class="foot"><a href="https://games.csiesheep.com/">&larr; <span data-t="nav.hub"></span></a></p>
</main>

<!-- ===== Solo setup ===== -->
<main id="view-setup" class="scr" hidden>
  <div class="bar"><a href="." data-link data-t="nav.back"></a><span data-t="nav.solo"></span></div>
  <div class="head"><p class="ph"><span data-t="setup.title"></span><small id="setupSub"></small></p><div class="seal">桌</div></div>
  <span class="lab" data-t="setup.players"></span>
  <div class="stepper"><button type="button" id="pMinus">&minus;</button><b id="pCount">7</b><button type="button" id="pPlus">+</button></div>
  <div class="field small" id="pSummary"></div>
  <span class="lab" data-t="setup.bots"></span>
  <div class="seg" id="levelSeg">
    <button type="button" data-level="easy" data-t="setup.easy"></button>
    <button type="button" data-level="normal" class="on" data-t="setup.normal"></button>
    <button type="button" data-level="hard" data-t="setup.hard"></button>
  </div>
  <span class="lab" data-t="setup.name"></span>
  <label class="field"><input id="nameInput" maxlength="16" autocomplete="off"></label>
  <label class="field check"><span data-t="setup.blind"></span><input type="checkbox" id="blindChk"></label>
  <label class="field check"><span data-t="setup.hours"></span><input type="checkbox" id="hoursChk"></label>
  <div class="spacer"></div>
  <button type="button" class="btn p" id="btnStart" data-t="setup.start"></button>
</main>

<!-- ===== Room lobby ===== -->
<main id="view-lobby" class="scr" hidden>
  <div class="bar"><button type="button" id="lbLeave" class="linkish" data-t="lobby.leave"></button><span data-t="lobby.room"></span></div>
  <div class="codebox"><span class="lab" data-t="landing.code"></span><div class="code" id="lbCode">····</div></div>
  <div class="row"><button type="button" class="btn sm gh" id="lbCopy" data-t="lobby.copy"></button><button type="button" class="btn sm gh" id="lbShare" data-t="lobby.share"></button></div>
  <span class="lab" id="lbSeatsLab"></span>
  <div class="list" id="lbSeats"></div>
  <div id="lbHost" hidden>
    <span class="lab" data-t="lobby.level"></span>
    <div class="seg" id="lbLevel">
      <button type="button" data-level="easy" data-t="setup.easy"></button>
      <button type="button" data-level="normal" data-t="setup.normal"></button>
      <button type="button" data-level="hard" data-t="setup.hard"></button>
    </div>
    <label class="field check"><span data-t="setup.blind"></span><input type="checkbox" id="lbBlind"></label>
    <label class="field check"><span data-t="setup.hours"></span><input type="checkbox" id="lbHours"></label>
  </div>
  <p class="note" id="lbStatus"></p>
  <div class="log" id="lbLog"></div>
  <div class="chat"><label class="field grow"><input id="lbChat" maxlength="200" autocomplete="off"></label><button type="button" class="btn sm gh" id="lbSend"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
  <div class="spacer"></div>
  <div class="row"><button type="button" class="btn" id="lbReady"></button><button type="button" class="btn p" id="lbStart" hidden></button></div>
</main>

<!-- ===== The table ===== -->
<main id="view-table" class="scr" hidden>
  <div class="bar"><span id="barLeft"></span><span id="barRight"></span></div>
  <div class="track" id="track"></div>
  <div class="vt" id="vtrack"></div>
  <div class="hour" id="hourBar" hidden></div>
  <div class="ring" id="ring"></div>
  <div id="panel"></div>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="chat" id="chatRow" hidden><label class="field grow"><input id="chatIn" maxlength="200" autocomplete="off"></label><button type="button" class="btn sm gh" id="chatSend"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
  <p class="foot" id="tableFoot" hidden><button type="button" class="linkish" id="tableLeave"></button></p>
</main>

<!-- ===== Reveal overlay ===== -->
<div id="overlay" class="overlay" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
